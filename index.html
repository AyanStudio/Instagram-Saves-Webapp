<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="description" content="Private local Instagram saves library">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<title>InstaSaves</title>
<style>
:root{color-scheme:dark;--bg:#0c0c0f;--panel:#15151a;--line:#282830;--text:#f5f5f7;--muted:#9b9ba5;--accent:#c7ff4a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}header{position:sticky;top:0;z-index:10;background:#0c0c0ff2;backdrop-filter:blur(13px);border-bottom:1px solid var(--line);padding:15px 16px}.head{max-width:900px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:22px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:2px}main{max-width:900px;margin:auto;padding:16px}.search,.input,.modal input,.modal textarea{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:13px;padding:13px;font-size:15px;outline:none}.row{display:flex;gap:8px;margin:13px 0}.row .input{flex:1;min-width:0}.hint{font-size:12px;color:var(--muted);line-height:1.5;margin:7px 0 14px}button,a.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:750;cursor:pointer;text-decoration:none;display:inline-flex;justify-content:center;align-items:center}.primary{background:var(--accent);color:#111}.ghost{background:#232329;color:var(--text)}.danger{background:#3a1d22;color:#ffb8c0}.tools{display:flex;gap:8px;margin-bottom:15px}.grid{display:grid;gap:13px}.card{overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:17px}.thumb{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;background:#101014}.body{padding:13px}.title{font-size:16px;font-weight:750}.author{font-size:12px;color:#b5b5bf;margin-top:3px}.url{font-size:12px;color:var(--muted);word-break:break-all;line-height:1.4;margin-top:5px}.caption{font-size:13px;line-height:1.5;color:#d3d3d8;margin-top:9px;white-space:pre-wrap}.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.tag{font-size:11px;color:#d7d7dd;border:1px solid var(--line);border-radius:999px;padding:4px 8px}.actions{display:flex;gap:7px;margin-top:12px}.actions>*{flex:1}.empty{text-align:center;color:var(--muted);padding:50px 15px}dialog{width:min(94vw,560px);border:1px solid var(--line);border-radius:17px;background:var(--panel);color:var(--text);padding:0}dialog::backdrop{background:#000b}.modal{padding:18px}.modal h2{margin:0 0 10px}.modal textarea{min-height:130px;resize:vertical;margin-top:8px}.modal-actions{display:flex;gap:8px;margin-top:10px}.modal-actions>*{flex:1}@media(min-width:720px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<header><div class="head"><div><h1>InstaSaves</h1><div class="sub" id="status">Local-only library</div></div><button id="exportBtn" class="ghost">Export</button></div></header>
<main>
<input id="search" class="search" placeholder="Search your saves…" autocomplete="off">
<div class="row"><input id="urlInput" class="input" inputmode="url" placeholder="Paste Instagram link"><button id="saveBtn" class="primary">Save</button></div>
<div class="hint">Share from Instagram directly to InstaSaves. The link is saved automatically. The app then tries to obtain a public post thumbnail/metadata; the saved record stays in this device's IndexedDB.</div>
<div class="tools"><button id="importBtn" class="ghost">Import</button><input id="fileInput" type="file" accept="application/json,.json" hidden></div>
<section id="grid" class="grid"></section>
</main>
<dialog id="dlg"><form id="form" class="modal" method="dialog"><h2>Edit save</h2><input id="fTitle" placeholder="Title"><input id="fAuthor" placeholder="Author / username" style="margin-top:8px"><textarea id="fCaption" placeholder="Caption / shared text"></textarea><input id="fTags" placeholder="Tags, comma separated" style="margin-top:8px"><div class="modal-actions"><button class="ghost" value="cancel">Cancel</button><button id="fSave" class="primary" value="default">Save</button></div></form></dialog>
<script>
const DB='instasaves-v6',STORE='saves';let db=null,editId=null;const $=id=>document.getElementById(id);
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'id',autoIncrement:true});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function all(){return new Promise((res,rej)=>{const r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function add(v){return new Promise((res,rej)=>{const r=db.transaction(STORE,'readwrite').objectStore(STORE).add(v);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function put(v){return new Promise((res,rej)=>{const r=db.transaction(STORE,'readwrite').objectStore(STORE).put(v);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function del(id){return new Promise((res,rej)=>{const r=db.transaction(STORE,'readwrite').objectStore(STORE).delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function norm(v){try{const u=new URL((v||'').trim());const h=u.hostname.replace(/^www\./,'').toLowerCase();if(h!=='instagram.com'&&!h.endsWith('.instagram.com'))return null;u.hash='';return u.toString()}catch{return null}}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function autoTags(url,text){const s=(url+' '+text).toLowerCase(),t=[];if(s.includes('/reel/'))t.push('reel');if(s.includes('/p/'))t.push('post');if(/ai|python|coding|developer|programming|software|tech|tool/.test(s))t.push('tech');if(/nature|travel|mountain|forest|wildlife/.test(s))t.push('nature');return [...new Set(t)]}
async function tryOembed(url){
  // Public Instagram oEmbed endpoint. Browser/CORS availability is not guaranteed.
  try{
    const endpoint='https://graph.facebook.com/v25.0/instagram_oembed?url='+encodeURIComponent(url);
    const r=await fetch(endpoint,{credentials:'omit'});
    if(!r.ok)throw Error('HTTP '+r.status);
    const d=await r.json();
    return {title:d.title||'',author:d.author_name||'',thumbnailUrl:d.thumbnail_url||''};
  }catch{return null}
}
async function tryCacheImage(url){
  if(!url)return '';
  try{const r=await fetch(url,{credentials:'omit'});if(!r.ok)throw Error();const b=await r.blob();if(!b.type.startsWith('image/'))return '';return await new Promise(resolve=>{const rd=new FileReader();rd.onload=()=>resolve(rd.result);rd.onerror=()=>resolve('');rd.readAsDataURL(b)})}catch{return ''}
}
async function saveItem(raw,title='',text=''){
  const url=norm(raw);if(!url)return false;
  const items=await all();if(items.some(x=>x.url===url))return true;
  // Create the local record first so Share->Save never gets lost while metadata is being fetched.
  const item={url,title:(title||'').trim()||'Instagram save',author:'',caption:(text||'').trim(),thumbnail:'',thumbnailUrl:'',tags:autoTags(url,text),createdAt:Date.now(),metadataStatus:'loading'};
  const id=await add(item);item.id=id;render();
  const meta=await tryOembed(url);
  if(meta){item.title=(item.title==='Instagram save'&&meta.title)?meta.title:item.title;item.author=meta.author||'';item.thumbnailUrl=meta.thumbnailUrl||'';const local=await tryCacheImage(meta.thumbnailUrl);item.thumbnail=local||meta.thumbnailUrl||'';item.metadataStatus=local?'local-thumbnail':(meta.thumbnailUrl?'remote-thumbnail':'metadata-no-thumbnail');await put(item);render()}
  else{item.metadataStatus='url-and-share-text-only';await put(item);render()}
  return true;
}
async function render(){let items=await all();items.sort((a,b)=>b.createdAt-a.createdAt);const q=$('search').value.trim().toLowerCase();const f=items.filter(x=>!q||[x.url,x.title,x.author,x.caption,...(x.tags||[])].join(' ').toLowerCase().includes(q));$('grid').innerHTML=f.length?f.map(x=>`<article class="card">${x.thumbnail?`<img class="thumb" src="${esc(x.thumbnail)}" alt="" loading="lazy">`:`<div class="thumb"></div>`}<div class="body"><div class="title">${esc(x.title||'Instagram save')}</div>${x.author?`<div class="author">@${esc(x.author)}</div>`:''}<div class="url">${esc(x.url)}</div>${x.caption?`<div class="caption">${esc(x.caption)}</div>`:''}<div class="tags">${(x.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="actions"><a class="btn ghost" href="${esc(x.url)}" target="_blank" rel="noopener">Open</a><button class="ghost" onclick="editSave(${x.id})">Edit</button><button class="danger" onclick="removeSave(${x.id})">Delete</button></div></div></article>`).join(''):`<div class="empty">${items.length?'No matching saves.':'No saves yet. Share an Instagram post/reel here.'}</div>`}
window.editSave=async id=>{const x=(await all()).find(v=>v.id===id);if(!x)return;editId=id;$('fTitle').value=x.title||'';$('fAuthor').value=x.author||'';$('fCaption').value=x.caption||'';$('fTags').value=(x.tags||[]).join(', ');$('dlg').showModal()};window.removeSave=async id=>{if(confirm('Delete this save?')){await del(id);render()}};
$('saveBtn').onclick=async()=>{const u=norm($('urlInput').value);if(!u)return alert('Please enter a valid Instagram URL.');await saveItem(u);$('urlInput').value='';render()};$('search').oninput=render;
$('form').addEventListener('submit',async e=>{if(e.submitter?.id!=='fSave')return;e.preventDefault();const x=(await all()).find(v=>v.id===editId);if(!x)return;x.title=$('fTitle').value.trim()||'Instagram save';x.author=$('fAuthor').value.trim();x.caption=$('fCaption').value.trim();x.tags=$('fTags').value.split(',').map(s=>s.trim()).filter(Boolean);await put(x);$('dlg').close();render()});
$('exportBtn').onclick=async()=>{const data=await all();const blob=new Blob([JSON.stringify({app:'InstaSaves',version:6,exportedAt:new Date().toISOString(),saves:data},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='instasaves-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$('importBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=async()=>{const f=$('fileInput').files?.[0];if(!f)return;try{const data=JSON.parse(await f.text()),saves=Array.isArray(data)?data:data.saves;if(!Array.isArray(saves))throw Error();const existing=await all(),seen=new Set(existing.map(x=>x.url));let n=0;for(const x of saves){const u=norm(x.url);if(u&&!seen.has(u)){await add({url:u,title:x.title||'Instagram save',author:x.author||'',caption:x.caption||'',thumbnail:x.thumbnail||'',thumbnailUrl:x.thumbnailUrl||'',tags:Array.isArray(x.tags)?x.tags:[],createdAt:x.createdAt||Date.now(),metadataStatus:x.metadataStatus||'imported'});seen.add(u);n++}}alert(`Imported ${n} new save(s).`);render()}catch{alert('Invalid InstaSaves backup.')}finally{$('fileInput').value=''}};
async function receiveShare(){const p=new URL(location.href).searchParams;const url=p.get('url')||'';const text=p.get('text')||'';const title=p.get('title')||'';if(url&&norm(url)){history.replaceState({},'',location.pathname);await saveItem(url,title,text);$('status').textContent='Saved from Instagram';}}
async function init(){db=await openDB();try{await navigator.serviceWorker?.register('./sw.js')}catch{}$('status').textContent=navigator.onLine?'Local-only · device storage':'Local-only · offline';await receiveShare();render()}init();
</script></body></html>
