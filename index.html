<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<meta name="description" content="Private, local-only Instagram saves library">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<title>InstaSaves</title>
<style>
:root{color-scheme:dark;--bg:#0b0b0d;--panel:#141418;--panel2:#1b1b21;--line:#2a2a33;--text:#f5f5f7;--muted:#9b9ba6;--accent:#c7ff4a;--danger:#ff6878}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:10;background:rgba(11,11,13,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:14px 16px}
.top{max-width:900px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:800;font-size:20px}.sub{font-size:12px;color:var(--muted);margin-top:2px}
main{max-width:900px;margin:auto;padding:16px}.search{width:100%;padding:14px 16px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:15px;outline:none;font-size:16px}.search:focus{border-color:#565663}
.toolbar{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}.toolbar button{flex:1;min-width:120px}
button{border:0;border-radius:12px;padding:11px 14px;font-weight:750;cursor:pointer}.primary{background:var(--accent);color:#0d0d0e}.ghost{background:var(--panel2);color:var(--text)}.danger{background:#32181d;color:#ffb3bd}
.add{background:var(--panel);border:1px solid var(--line);padding:13px;border-radius:16px;margin-bottom:14px}.row{display:flex;gap:9px}.row input{flex:1;min-width:0}.input{border:1px solid var(--line);background:#101014;color:var(--text);border-radius:12px;padding:12px;font-size:14px;outline:none}.hint{font-size:12px;color:var(--muted);line-height:1.45;margin-top:9px}
.grid{display:grid;gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}.thumb{width:100%;aspect-ratio:16/10;object-fit:cover;background:#101014;display:block}.placeholder{display:grid;place-items:center;color:#555562;font-size:13px}.body{padding:14px}.title{font-weight:750;font-size:16px;line-height:1.3}.url{font-size:12px;color:var(--muted);margin-top:6px;word-break:break-all;line-height:1.35}.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.tag{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:4px 8px;color:#d4d4dc}.notes{margin-top:10px;color:#c4c4cc;font-size:13px;line-height:1.45}.actions{display:flex;gap:8px;margin-top:12px}.actions>*{flex:1;text-align:center}.actions a{display:block;text-decoration:none;padding:11px 14px;border-radius:12px}.empty{color:var(--muted);text-align:center;padding:52px 16px;line-height:1.5}
dialog{width:min(92vw,520px);border:1px solid var(--line);border-radius:18px;background:var(--panel);color:var(--text);padding:0}dialog::backdrop{background:rgba(0,0,0,.7)}.modal{padding:18px}.modal h2{margin:0 0 14px}.modal-actions{display:flex;gap:8px;margin-top:12px}.modal-actions button{flex:1}.notice{font-size:12px;color:var(--muted);padding:10px 0}
@media(min-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<header><div class="top"><div><div class="brand">InstaSaves</div><div class="sub" id="status">Local-only library</div></div><button class="ghost" id="exportBtn">Export</button></div></header>
<main>
  <input id="search" class="search" placeholder="Search your saves…" autocomplete="off">
  <section class="add">
    <div class="row"><input id="urlInput" class="input" type="url" inputmode="url" placeholder="Paste an Instagram link"><button id="saveBtn" class="primary">Save</button></div>
    <div class="hint">Everything you save is stored in this device's IndexedDB. The app does not have a database/server.</div>
  </section>
  <div class="toolbar"><button id="importBtn" class="ghost">Import</button><button id="clearBtn" class="danger">Clear all</button></div>
  <input id="importFile" type="file" accept="application/json,.json" hidden>
  <section id="grid" class="grid"></section>
</main>
<dialog id="editDialog"><form id="editForm" method="dialog" class="modal"><h2>Edit save</h2><input id="editTitle" class="search" placeholder="Title"><div style="height:10px"></div><input id="editTags" class="search" placeholder="Tags, comma separated"><div style="height:10px"></div><textarea id="editNotes" class="search" style="min-height:120px;resize:vertical" placeholder="Notes"></textarea><div class="modal-actions"><button type="button" class="ghost" id="cancelEdit">Cancel</button><button type="submit" class="primary">Save changes</button></div></form></dialog>
<script>
const DB='instasaves-v3', STORE='saves'; let db=null, editId=null;
const $=id=>document.getElementById(id);
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'id',autoIncrement:true});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function store(mode='readonly'){return db.transaction(STORE,mode).objectStore(STORE)}
function getAll(){return new Promise((res,rej)=>{const r=store().getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function put(v){return new Promise((res,rej)=>{const r=store('readwrite').put(v);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function add(v){return new Promise((res,rej)=>{const r=store('readwrite').add(v);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function del(id){return new Promise((res,rej)=>{const r=store('readwrite').delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function clearAll(){return new Promise((res,rej)=>{const r=store('readwrite').clear();r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function validUrl(s){try{const u=new URL(s.trim()); if(!/^www\.instagram\.com$|^instagram\.com$|^[a-z]+\.instagram\.com$/i.test(u.hostname))return null; u.hash=''; return u.toString()}catch{return null}}
function tagsFromUrl(url){const p=url.toLowerCase(),a=[];if(p.includes('/reel/'))a.push('reel');else if(p.includes('/p/'))a.push('post');else if(p.includes('/tv/'))a.push('video');return a}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function placeholder(){return '<div class="thumb placeholder">Instagram save</div>'}
async function render(){let items=await getAll();items.sort((a,b)=>b.createdAt-a.createdAt);const q=$('search').value.trim().toLowerCase();if(q)items=items.filter(x=>[x.url,x.title,x.caption,x.notes,...(x.tags||[])].join(' ').toLowerCase().includes(q));if(!items.length){$('grid').innerHTML='<div class="empty">'+(q?'No saves match your search.':'No saves yet. Share an Instagram post to InstaSaves or paste a link above.')+'</div>';return}$('grid').innerHTML=items.map(x=>`<article class="card">${x.thumbnail?`<img class="thumb" src="${esc(x.thumbnail)}" alt="" loading="lazy">`:placeholder()}<div class="body"><div class="title">${esc(x.title||'Instagram save')}</div><div class="url">${esc(x.url)}</div>${x.caption?`<div class="notes">${esc(x.caption)}</div>`:''}<div class="tags">${(x.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>${x.notes?`<div class="notes">${esc(x.notes)}</div>`:''}<div class="actions"><a class="ghost" href="${esc(x.url)}" target="_blank" rel="noopener">Open</a><button class="ghost" onclick="window.editSave(${x.id})">Edit</button><button class="danger" onclick="window.deleteSave(${x.id})">Delete</button></div></div></article>`).join('')}
window.deleteSave=async id=>{if(!confirm('Delete this save?'))return;await del(id);await render()};
window.editSave=async id=>{const x=(await getAll()).find(v=>v.id===id);if(!x)return;editId=id;$('editTitle').value=x.title||'';$('editTags').value=(x.tags||[]).join(', ');$('editNotes').value=x.notes||'';$('editDialog').showModal()};
async function saveUrl(raw){const url=validUrl(raw);if(!url)return false;const items=await getAll();if(items.some(x=>x.url===url))return true;await add({url,title:'Instagram save',caption:'',thumbnail:'',tags:tagsFromUrl(url),notes:'',createdAt:Date.now()});return true}
$('saveBtn').onclick=async()=>{if(!(await saveUrl($('urlInput').value)))return alert('Paste a valid Instagram URL.');$('urlInput').value='';await render()};$('search').oninput=render;$('cancelEdit').onclick=()=>$('editDialog').close();
$('editForm').onsubmit=async e=>{e.preventDefault();const x=(await getAll()).find(v=>v.id===editId);if(!x)return;x.title=$('editTitle').value.trim()||'Instagram save';x.tags=$('editTags').value.split(',').map(s=>s.trim()).filter(Boolean);x.notes=$('editNotes').value.trim();await put(x);$('editDialog').close();await render()};
$('exportBtn').onclick=async()=>{const blob=new Blob([JSON.stringify({format:'instasaves-v3',exportedAt:new Date().toISOString(),saves:await getAll()},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='instasaves-backup.json';a.click();URL.revokeObjectURL(a.href)};
$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const d=JSON.parse(await f.text());for(const x of (d.saves||[])){if(validUrl(x.url))await saveUrl(x.url).then(async()=>{const items=await getAll();const y=items.find(v=>v.url===validUrl(x.url));if(y){y.title=x.title||y.title;y.caption=x.caption||'';y.thumbnail=x.thumbnail||'';y.tags=x.tags||[];y.notes=x.notes||'';await put(y)}})}await render();alert('Import complete.')}catch{alert('That backup is invalid.')}};
$('clearBtn').onclick=async()=>{if(confirm('Delete every local save from this device?')){await clearAll();await render()}};
async function handleShareUrl(){const qs=new URLSearchParams(location.search);const shared=qs.get('url')||qs.get('shared_url')||qs.get('text');if(shared){const u=validUrl(shared)||((shared.match(/https?:\/\/[^\s]+/i)||[])[0]&&validUrl((shared.match(/https?:\/\/[^\s]+/i)||[])[0]));if(u){await saveUrl(u);$('status').textContent='Saved from Android share';await render()}history.replaceState({},'',location.pathname)}}
async function init(){db=await openDB();if('serviceWorker'in navigator){try{await navigator.serviceWorker.register('./sw.js',{scope:'./'})}catch{}}$('status').textContent=navigator.onLine?'Local-only library':'Local-only · offline';await handleShareUrl();await render()}
init();
</script>
</body>
</html>
