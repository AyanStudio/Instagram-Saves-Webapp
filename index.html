<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111111"><meta name="description" content="Private offline Instagram saves library"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon.svg"><title>InstaSaves</title><style>:root{color-scheme:dark;--bg:#0c0c0f;--panel:#15151a;--line:#282830;--text:#f5f5f7;--muted:#9b9ba5;--accent:#c7ff4a}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}header{position:sticky;top:0;z-index:5;padding:16px;background:rgba(12,12,15,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.title{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:22px;margin:0}.sub{color:var(--muted);font-size:13px;margin-top:3px}main{max-width:820px;margin:auto;padding:16px}.search{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:14px;padding:14px 16px;font-size:16px;outline:none}.search:focus{border-color:#555563}.add{margin:14px 0 18px;border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:14px}.row{display:flex;gap:10px}input[type=url]{flex:1;min-width:0;border:1px solid var(--line);background:#0f0f13;color:var(--text);border-radius:12px;padding:12px;font-size:14px}button{border:0;border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer}.primary{background:var(--accent);color:#101010}.ghost{background:#22222a;color:var(--text)}.danger{background:#3a1d22;color:#ffb8c0}.hint{margin-top:9px;color:var(--muted);font-size:12px;line-height:1.45}.grid{display:grid;gap:14px}.card{overflow:hidden;border:1px solid var(--line);background:var(--panel);border-radius:18px}.thumb{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:#101014}.body{padding:14px}.url{font-size:13px;color:var(--muted);word-break:break-all;line-height:1.4}.meta{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.tag{border:1px solid var(--line);border-radius:999px;padding:5px 9px;color:#d8d8de;font-size:12px}.actions{display:flex;gap:8px;margin-top:12px}.actions button,.actions a{flex:1;text-align:center;text-decoration:none}.empty{text-align:center;padding:56px 18px;color:var(--muted)}dialog{width:min(92vw,520px);border:1px solid var(--line);border-radius:18px;background:var(--panel);color:var(--text);padding:0}dialog::backdrop{background:rgba(0,0,0,.65)}.modal{padding:18px}.modal h2{margin-top:0}textarea{width:100%;min-height:120px;resize:vertical;border:1px solid var(--line);background:#0f0f13;color:var(--text);border-radius:12px;padding:12px}.modal-actions{display:flex;gap:8px;margin-top:12px}.modal-actions button{flex:1}@media(min-width:720px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body><header><div class="title"><div><h1>InstaSaves</h1><div class="sub" id="status">Private · offline library</div></div><button class="ghost" id="exportBtn">Export</button></div></header><main><input class="search" id="search" placeholder="Search your saves…" autocomplete="off"><section class="add"><div class="row"><input id="urlInput" type="url" inputmode="url" placeholder="Paste an Instagram link"><button class="primary" id="saveBtn">Save</button></div><div class="hint">On Android, use Instagram → Share → InstaSaves. Everything in this MVP is stored only on this device.</div></section><section class="grid" id="grid"></section></main><dialog id="editDialog"><form method="dialog" class="modal" id="editForm"><h2>Edit save</h2><input id="editTitle" class="search" placeholder="Title"><div style="height:10px"></div><input id="editTags" class="search" placeholder="Tags, separated by commas"><div style="height:10px"></div><textarea id="editNotes" placeholder="Notes"></textarea><div class="modal-actions"><button class="ghost" value="cancel">Cancel</button><button class="primary" id="editSave" value="default">Save changes</button></div></form></dialog><script>const DB_NAME='instasaves-v1',STORE='saves',$=id=>document.getElementById(id);let db,editId=null;function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'id',autoIncrement:true});r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}function tx(mode='readonly'){return db.transaction(STORE,mode).objectStore(STORE)}function allSaves(){return new Promise((resolve,reject)=>{const r=tx().getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}function addSave(o){return new Promise((resolve,reject)=>{const r=tx('readwrite').add(o);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}function putSave(o){return new Promise((resolve,reject)=>{const r=tx('readwrite').put(o);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}function deleteSave(id){return new Promise((resolve,reject)=>{const r=tx('readwrite').delete(id);r.onsuccess=()=>resolve();r.onerror=()=>reject(r.error)})}function normalizeInstagramUrl(input){try{const u=new URL(input.trim());if(!/(^|\.)instagram\.com$/i.test(u.hostname))return null;u.hash='';return u.toString()}catch{return null}}function inferTags(url){const p=url.toLowerCase(),t=[];if(p.includes('/reel/'))t.push('reel');else if(p.includes('/p/'))t.push('post');else if(p.includes('/tv/'))t.push('video');return t}function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){allSaves().then(items=>{const q=$('search').value.trim().toLowerCase();items.sort((a,b)=>b.createdAt-a.createdAt);const f=items.filter(x=>!q||[x.url,x.title,x.notes,...(x.tags||[])].join(' ').toLowerCase().includes(q));if(!f.length){$('grid').innerHTML=`<div class="empty">${items.length?'No saves match your search.':'No saves yet.<br><br>Share an Instagram post here from Android.'}</div>`;return}$('grid').innerHTML=f.map(x=>`<article class="card">${x.thumbnail?`<img class="thumb" src="${safe(x.thumbnail)}" alt="" loading="lazy">`:`<div class="thumb"></div>`}<div class="body"><strong>${safe(x.title||'Instagram save')}</strong><div class="url">${safe(x.url)}</div><div class="meta">${(x.tags||[]).map(t=>`<span class="tag">${safe(t)}</span>`).join('')}</div>${x.notes?`<div style="color:#c9c9d0;font-size:13px;line-height:1.5">${safe(x.notes)}</div>`:''}<div class="actions"><a class="ghost" style="padding:11px 14px;border-radius:12px;color:var(--text)" href="${safe(x.url)}" target="_blank" rel="noopener">Open</a><button class="ghost" onclick="editSave(${x.id})">Edit</button><button class="danger" onclick="removeSave(${x.id})">Delete</button></div></div></article>`).join('')})}window.editSave=async id=>{const x=(await allSaves()).find(v=>v.id===id);if(!x)return;editId=id;$('editTitle').value=x.title||'';$('editTags').value=(x.tags||[]).join(', ');$('editNotes').value=x.notes||'';$('editDialog').showModal()};window.removeSave=async id=>{if(!confirm('Delete this save?'))return;await deleteSave(id);render()};$('saveBtn').onclick=async()=>{const url=normalizeInstagramUrl($('urlInput').value);if(!url)return alert('Paste a valid Instagram URL.');const items=await allSaves();if(items.some(x=>x.url===url))return alert('That post is already saved.');await addSave({url,title:'Instagram save',tags:inferTags(url),notes:'',thumbnail:'',createdAt:Date.now()});$('urlInput').value='';render()};$('search').oninput=render;$('editForm').addEventListener('submit',async e=>{if(e.submitter?.id!=='editSave')return;e.preventDefault();const x=(await allSaves()).find(v=>v.id===editId);if(!x)return;x.title=$('editTitle').value.trim()||'Instagram save';x.tags=$('editTags').value.split(',').map(s=>s.trim()).filter(Boolean);x.notes=$('editNotes').value.trim();await putSave(x);$('editDialog').close();render()});$('exportBtn').onclick=async()=>{const data=await allSaves(),blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),saves:data},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`instasaves-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href)};async function handleShareTarget(){const p=new URLSearchParams(location.search),shared=p.get('shared_url')||p.get('url')||p.get('text');if(shared){$('urlInput').value=shared;history.replaceState({},'',location.pathname);const url=normalizeInstagramUrl(shared);if(url){const items=await allSaves();if(!items.some(x=>x.url===url))await addSave({url,title:'Instagram save',tags:inferTags(url),notes:'',thumbnail:'',createdAt:Date.now()});render()}}}async function init(){db=await openDB();if('serviceWorker'in navigator)try{await navigator.serviceWorker.register('./sw.js')}catch(e){}$('status').textContent=navigator.onLine?'Private · device storage':'Private · offline';await handleShareTarget();render()}init();</script></body></html>
