<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111111"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon-192.png"><title>InstaSaves</title><style>body{margin:0;font-family:system-ui;background:#0c0c0f;color:#f5f5f7}header{position:sticky;top:0;background:#0c0c0fee;padding:15px;border-bottom:1px solid #282830;z-index:2}main{max-width:900px;margin:auto;padding:15px}.top{display:flex;justify-content:space-between;align-items:center}.sub{color:#9b9ba5;font-size:12px}input,textarea{width:100%;box-sizing:border-box;background:#15151a;color:#fff;border:1px solid #282830;border-radius:12px;padding:12px;font-size:15px}button,a{border:0;border-radius:11px;padding:10px 12px;font-weight:700;text-decoration:none}.primary{background:#c7ff4a;color:#111}.ghost{background:#22222a;color:#fff}.danger{background:#3a1d22;color:#ffbcc4}.row{display:flex;gap:8px;margin:12px 0}.row input{flex:1}.tools{display:flex;gap:8px;margin-bottom:15px}.grid{display:grid;gap:13px}.card{background:#15151a;border:1px solid #282830;border-radius:17px;overflow:hidden}.thumb{width:100%;aspect-ratio:1.6;object-fit:cover;background:#101014}.body{padding:13px}.url{color:#9b9ba5;font-size:12px;word-break:break-all;margin-top:5px}.caption{margin-top:8px;color:#d3d3d8;font-size:13px;white-space:pre-wrap}.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.tag{font-size:11px;border:1px solid #282830;padding:4px 8px;border-radius:999px}.actions{display:flex;gap:7px;margin-top:12px}.actions>*{flex:1;text-align:center}.empty{text-align:center;color:#9b9ba5;padding:50px 10px}dialog{width:min(94vw,560px);border:1px solid #282830;border-radius:17px;background:#15151a;color:#fff;padding:0}dialog::backdrop{background:#000a}.modal{padding:18px}.modal h2{margin:0 0 10px}.modal-actions{display:flex;gap:8px;margin-top:10px}.modal-actions>*{flex:1}.hint{font-size:12px;color:#9b9ba5;line-height:1.45}</style></head><body><header><div class="top"><div><b style="font-size:21px">InstaSaves</b><div class="sub" id="status">Local-only</div></div><button class="ghost" id="exportBtn">Export</button></div></header><main><input id="search" placeholder="Search saves…"><div class="row"><input id="url" inputmode="url" placeholder="Paste Instagram link"><button class="primary" id="save">Save</button></div><div class="tools"><button class="ghost" id="importBtn">Import</button><input id="file" type="file" accept="application/json,.json" hidden></div><div class="hint">For public posts/reels, the app tries Meta's tokenless oEmbed endpoint to obtain available embed metadata and a thumbnail. If that request is blocked by browser policy or the post is unsupported, the URL and shared text are still saved locally.</div><section id="grid" class="grid" style="margin-top:14px"></section></main><dialog id="dlg"><form id="form" method="dialog" class="modal"><h2>Edit save</h2><input id="title" placeholder="Title"><div style="height:8px"></div><textarea id="caption" placeholder="Caption/shared text"></textarea><div style="height:8px"></div><input id="tags" placeholder="Tags, comma separated"><div class="modal-actions"><button class="ghost">Cancel</button><button class="primary" id="saveEdit">Save</button></div></form></dialog><script>
const DB='instasaves-v5',STORE='saves';let db,editId=null;const $=id=>document.getElementById(id);
function openDB(){return new Promise((r,j)=>{let q=indexedDB.open(DB,1);q.onupgradeneeded=()=>q.result.createObjectStore(STORE,{keyPath:'id',autoIncrement:true});q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)})}function getAll(){return new Promise((r,j)=>{let q=db.transaction(STORE).objectStore(STORE).getAll();q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)})}function put(x){return new Promise((r,j)=>{let q=db.transaction(STORE,'readwrite').objectStore(STORE).put(x);q.onsuccess=()=>r();q.onerror=()=>j(q.error)})}function add(x){return new Promise((r,j)=>{let q=db.transaction(STORE,'readwrite').objectStore(STORE).add(x);q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)})}function del(id){return new Promise((r,j)=>{let q=db.transaction(STORE,'readwrite').objectStore(STORE).delete(id);q.onsuccess=()=>r();q.onerror=()=>j(q.error)})}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function norm(v){try{let u=new URL((v||'').trim());let h=u.hostname.replace(/^www\./,'').toLowerCase();if(h!=='instagram.com'&&!h.endsWith('.instagram.com'))return null;u.hash='';return u.toString()}catch{return null}}
async function oembed(url){try{let endpoint='https://graph.facebook.com/v25.0/instagram_oembed?url='+encodeURIComponent(url);let r=await fetch(endpoint,{mode:'cors'});if(!r.ok)throw Error('oEmbed '+r.status);let d=await r.json();return {title:d.title||d.author_name||'',thumbnail:d.thumbnail_url||'',author:d.author_name||'',html:d.html||''}}catch{return null}}
function autoTags(url,text){let s=(url+' '+text).toLowerCase(),t=[];if(s.includes('/reel/'))t.push('reel');if(s.includes('/p/'))t.push('post');if(/ai|python|coding|developer|programming|software|tech|tool/.test(s))t.push('tech');if(/nature|travel|mountain|forest|wildlife/.test(s))t.push('nature');return [...new Set(t)]}
async function saveItem(input,title='',text=''){let url=norm(input);if(!url)return false;let items=await getAll(),old=items.find(x=>x.url===url);if(old)return true;let meta=await oembed(url);let caption=(text||'').trim();let item={url,title:(title||'').trim()||meta?.title||'Instagram save',caption,tags:autoTags(url,caption+' '+(meta?.title||'')),thumbnail:meta?.thumbnail||'',author:meta?.author||'',createdAt:Date.now()};await add(item);return true}
async function render(){let items=await getAll(),q=$('search').value.trim().toLowerCase();items.sort((a,b)=>b.createdAt-a.createdAt);let f=items.filter(x=>!q||[x.url,x.title,x.caption,x.author,...(x.tags||[])].join(' ').toLowerCase().includes(q));$('grid').innerHTML=f.length?f.map(x=>`<article class="card">${x.thumbnail?`<img class="thumb" src="${esc(x.thumbnail)}" loading="lazy" alt="">`:`<div class="thumb"></div>`}<div class="body"><b>${esc(x.title||'Instagram save')}</b>${x.author?`<div class="sub">@${esc(x.author)}</div>`:''}<div class="url">${esc(x.url)}</div>${x.caption?`<div class="caption">${esc(x.caption)}</div>`:''}<div class="meta">${(x.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="actions"><a class="ghost" href="${esc(x.url)}" target="_blank" rel="noopener">Open</a><button class="ghost" onclick="edit(${x.id})">Edit</button><button class="danger" onclick="removeIt(${x.id})">Delete</button></div></div></article>`).join(''):`<div class="empty">${items.length?'No matches.':'No saves yet.'}</div>`}
window.removeIt=async id=>{if(confirm('Delete this save?')){await new Promise((r,j)=>{let q=db.transaction(STORE,'readwrite').objectStore(STORE).delete(id);q.onsuccess=r;q.onerror=()=>j(q.error)});render()}};window.edit=async id=>{let x=(await getAll()).find(v=>v.id===id);if(!x)return;editId=id;$('title').value=x.title||'';$('caption').value=x.caption||'';$('tags').value=(x.tags||[]).join(', ');$('dlg').showModal()};
$('save').onclick=async()=>{if(await saveItem($('url').value)){$('url').value='';await render()}else alert('Please enter a valid Instagram URL.')};$('search').oninput=render;$('form').addEventListener('submit',async e=>{if(e.submitter?.id!=='saveEdit')return;e.preventDefault();let x=(await getAll()).find(v=>v.id===editId);if(!x)return;x.title=$('title').value.trim()||'Instagram save';x.caption=$('caption').value.trim();x.tags=$('tags').value.split(',').map(s=>s.trim()).filter(Boolean);await put(x);$('dlg').close();render()});
$('exportBtn').onclick=async()=>{let data=await getAll(),blob=new Blob([JSON.stringify({app:'InstaSaves',version:5,exportedAt:new Date().toISOString(),saves:data},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='instasaves-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('importBtn').onclick=()=> $('file').click();$('file').onchange=async()=>{let f=$('file').files[0];if(!f)return;try{let d=JSON.parse(await f.text()),s=Array.isArray(d)?d:d.saves;if(!Array.isArray(s))throw 0;let cur=await getAll(),seen=new Set(cur.map(x=>x.url)),n=0;for(let x of s){let u=norm(x.url);if(u&&!seen.has(u)){await add({url:u,title:x.title||'Instagram save',caption:x.caption||'',tags:Array.isArray(x.tags)?x.tags:[],thumbnail:x.thumbnail||'',author:x.author||'',createdAt:x.createdAt||Date.now()});seen.add(u);n++}}alert(`Imported ${n} new save(s).`);render()}catch{alert('Invalid InstaSaves backup.')}finally{$('file').value=''}};
async function receive(){let p=new URL(location.href).searchParams,u=p.get('url')||'',t=p.get('title')||'',x=p.get('text')||'';if(u&&norm(u)){await saveItem(u,t,x);history.replaceState({},'',location.pathname);render()}}async function init(){db=await openDB();try{await navigator.serviceWorker?.register('./sw.js')}catch{}$('status').textContent=navigator.onLine?'Local-only · device storage':'Local-only · offline';await receive();render()}init();</script></body></html>
